name: Build NULITE ESP8266 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "platformio.ini"
      - ".github/workflows/build-firmware.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build firmware
        run: pio run -e nodemcuv2

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release
          cp .pio/build/nodemcuv2/firmware.bin release/NULITE-ESP8266-${GITHUB_RUN_NUMBER}.bin
          sha256sum release/*.bin > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/* \
            --title "NULITE ESP8266 ${TAG}" \
            --notes "Automatycznie zbudowany firmware dla NodeMCU V3 / ESP8266.\n\nCommit: ${GITHUB_SHA}\nBuild: ${GITHUB_RUN_NUMBER}\n\nPrzed aktualizacją sprawdź zgodność firmware z urządzeniem."
