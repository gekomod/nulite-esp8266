name: ESP8266 firmware build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile NodeMCU ESP8266 firmware
        run: pio run -e nodemcuv2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: nulite-esp8266-firmware
          path: .pio/build/nodemcuv2/firmware.bin
          if-no-files-found: error
          retention-days: 14
